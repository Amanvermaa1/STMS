services:
  - type: web
    name: stms-api
    runtime: docker
    plan: free
    rootDir: server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://stms-web-lwoq.onrender.com
      - key: WEBAUTHN_RP_ID
        value: stms-web-lwoq.onrender.com
      - key: WEBAUTHN_RP_NAME
        value: STMS Helpdesk
      - key: WEBAUTHN_ORIGINS
        value: https://stms-web-lwoq.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Helpdesk Admin

  - type: web
    name: stms-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://stms-api-89yn.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
